<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242429" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#303038" stroke-width="2" />

  <g filter="url(#glow)">
    <path d="M 24 28 L 104 28 L 104 84 L 76 84 L 56 104 L 56 84 L 24 84 Z" 
          fill="#18181B" stroke="#A970FF" stroke-width="10" stroke-linejoin="round" />

    <line x1="44" y1="46" x2="84" y2="46" stroke="#00E6CB" stroke-width="8" stroke-linecap="round" />
    <line x1="44" y1="66" x2="64" y2="66" stroke="#00E6CB" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
