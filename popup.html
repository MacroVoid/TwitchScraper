<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --primary: #9146FF;
      --primary-hover: #A970FF;
      --bg: #0E0E10;
      --surface: #18181B;
      --surface-light: #26262C;
      --text: #EFEFF1;
      --text-muted: #ADADB8;
      --border: #3A3A3D;
      --success: #00E6CB;
      --error: #FF4F4D;
      --warning: #F0B300;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1a20, var(--primary));
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(145,70,255,0.3);
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      outline: none;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .header-btn.active {
      background: rgba(145, 70, 255, 0.2);
      color: var(--primary-hover);
      border-color: rgba(145, 70, 255, 0.4);
    }

    .header-icon {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    .header h2 { margin: 0; font-size: 17px; font-weight: 700; }

    .container { padding: 16px; }

    .section {
      background: var(--surface);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .section:hover { border-color: rgba(145,70,255,0.4); }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.8px;
    }

    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .checkbox-label {
      display: flex; align-items: center;
      font-size: 13px; cursor: pointer; color: var(--text);
      transition: color 0.2s;
    }
    .checkbox-label:hover { color: var(--primary-hover); }
    .checkbox-label input {
      appearance: none; width: 15px; height: 15px;
      border: 2px solid var(--text-muted); border-radius: 4px;
      margin-right: 7px; background-color: var(--surface-light);
      cursor: pointer; position: relative; transition: all 0.15s ease; flex-shrink: 0;
    }
    .checkbox-label input:checked { background-color: var(--primary); border-color: var(--primary); }
    .checkbox-label input:checked::after {
      content: '✓'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); color: white; font-size: 10px; font-weight: bold;
    }

    select, input[type="number"] {
      width: 100%; padding: 9px 10px;
      background: var(--surface-light); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      font-family: inherit; font-size: 13px; transition: border-color 0.2s;
    }
    select { cursor: pointer; appearance: none; }
    select:focus, input:focus { outline: none; border-color: var(--primary); }

    .two-col { display: flex; gap: 10px; align-items: center; }
    .two-col label { font-size: 13px; color: var(--text); white-space: nowrap; }
    .two-col input { width: 90px; padding: 7px; text-align: center; flex-shrink: 0; }

    .radio-group { display: flex; gap: 18px; }
    .radio-label { display: flex; align-items: center; font-size: 13px; cursor: pointer; }
    .radio-label input { margin-right: 7px; accent-color: var(--primary); width: 15px; height: 15px; }

    /* ===== PROGRESS SECTION ===== */
    #progress-section {
      background: var(--surface);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: none;
    }
    #progress-section.visible { display: block; }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label { font-size: 13px; font-weight: 600; color: var(--text); }

    .progress-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-hover);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-wrap {
      height: 8px;
      background: var(--surface-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9146FF, #C27AFF, #9146FF);
      background-size: 200% 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
      animation: shimmer 1.8s linear infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .progress-bar-fill.done {
      background: linear-gradient(90deg, var(--success), #00b09b);
      animation: none;
    }

    .progress-bar-fill.indeterminate {
      width: 100% !important;
      animation: shimmer 1.8s linear infinite, pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to   { opacity: 1; }
    }

    .progress-sub {
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== BUTTON ===== */
    .btn-collect {
      width: 100%; padding: 13px;
      background: var(--primary); color: white; border: none;
      border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-collect:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(145,70,255,0.35);
    }
    .btn-collect:active:not(:disabled) { transform: translateY(0); }
    .btn-collect:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      width: 100%; padding: 10px;
      background: transparent; color: var(--text-muted); border: 1px solid var(--border);
      border-radius: 9px; font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
    }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary-hover); }

    .action-buttons {
      display: none;
      gap: 8px;
      margin-top: 0;
    }
    .action-buttons.visible { display: flex; }

    .btn-stop {
      flex: 1; padding: 11px;
      background: rgba(255,79,77,0.12); color: var(--error); border: 1px solid rgba(255,79,77,0.35);
      border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-stop:hover { background: rgba(255,79,77,0.22); border-color: var(--error); }

    .btn-finish {
      flex: 1; padding: 11px;
      background: rgba(240,179,0,0.12); color: var(--warning); border: 1px solid rgba(240,179,0,0.35);
      border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-finish:hover { background: rgba(240,179,0,0.22); border-color: var(--warning); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
      margin-top: 10px; letter-spacing: 0.3px;
    }
    .status-pill.running { background: rgba(145,70,255,0.15); color: var(--primary-hover); }
    .status-pill.done    { background: rgba(0,230,203,0.15); color: var(--success); }
    .status-pill.error   { background: rgba(255,79,77,0.15); color: var(--error); }

    .dot-pulse { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: dotPulse 1s ease-in-out infinite; }
    @keyframes dotPulse { 0%,100% { opacity: 0.4; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== КАСТОМНЫЙ СПИСОК ЯЗЫКОВ ===== */
    .lang-select-container {
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
    }
    .lang-list {
      max-height: 120px;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .lang-list .checkbox-label {
      padding: 5px 6px;
      margin: 0;
    }
    .lang-list .checkbox-label:hover {
      background: rgba(255,255,255,0.05);
      border-radius: 5px;
    }

    /* ===== ИДЕАЛЬНОЕ ЦЕНТРИРОВАНИЕ INPUT NUMBER ===== */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="header-icon">📡</div>
      <h2>Twitch Scraper</h2>
    </div>
    <button id="debug_toggle_btn" class="header-btn" title="Панель отладки">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bug-icon lucide-bug"><path d="M12 20v-9"/><path d="M14 7a4 4 0 0 1 4 4v3a6 6 0 0 1-12 0v-3a4 4 0 0 1 4-4z"/><path d="M14.12 3.88 16 2"/><path d="M21 21a4 4 0 0 0-3.81-4"/><path d="M21 5a4 4 0 0 1-3.55 3.97"/><path d="M22 13h-4"/><path d="M3 21a4 4 0 0 1 3.81-4"/><path d="M3 5a4 4 0 0 0 3.55 3.97"/><path d="M6 13H2"/><path d="m8 2 1.88 1.88"/><path d="M9 7.13V6a3 3 0 1 1 6 0v1.13"/></svg>
    </button>
  </div>
  
  <!-- MAIN VIEW -->
  <div class="container" id="main-view">

    <!-- ПРОГРЕСС (скрыт если неактивен) -->
    <div id="progress-section">
      <div class="progress-header">
        <span class="progress-label" id="progress-label">Сбор данных...</span>
        <span class="progress-count" id="progress-count">0</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill indeterminate" id="progress-bar"></div>
      </div>
      <div class="progress-sub" id="progress-sub">Инициализация...</div>
    </div>

    <!-- ПОЛЯ ДЛЯ СБОРА -->
    <div class="section" id="fields-section">
      <div class="section-title">Данные для сбора</div>
      <div class="grid-options">
        <label class="checkbox-label"><input type="checkbox" id="cb_channel" checked> Канал</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_category" checked> Категория</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_tags" checked> Теги</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_viewers" checked> Зрители</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_followers" checked> Фолловеры</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_title" checked> Название</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_language" checked> Язык</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_url" checked> Ссылка</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_desc" checked> Описание</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_social" checked> Соц. сети</label>
        <label class="checkbox-label"><input type="checkbox" id="cb_panels"> Панели</label>
      </div>
    </div>

    <!-- ФИЛЬТР -->
    <div class="section" id="filter-section">
      <div class="section-title">Фильтры</div>
      <div class="lang-select-container">
        <div class="lang-list" id="lang_list"></div>
      </div>
      <label class="checkbox-label" style="margin-top: 8px;">
        <input type="checkbox" id="cb_subonly"> Включать приватные (Sub-Only)
      </label>
    </div>

    <div class="section" id="settings-section">
      <div class="section-title">Настройки экспорта</div>
      <div class="two-col" style="margin-bottom: 12px;">
        <label for="max_streams">Лимит (0 - без лимита):</label>
        <input type="number" id="max_streams" value="0" min="0" max="100000">
      </div>
      <div class="radio-group" style="margin-bottom: 12px;">
        <label class="radio-label"><input type="radio" name="format" value="json" checked> JSON</label>
        <label class="radio-label"><input type="radio" name="format" value="md"> Markdown</label>
      </div>

      <div class="section-title">Сортировка по зрителям</div>
      <div class="radio-group" style="margin-bottom: 12px;">
        <label class="radio-label">
          <input type="radio" name="sort_dir" value="desc" checked>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></svg>
          По убыванию
        </label>
        <label class="radio-label">
          <input type="radio" name="sort_dir" value="asc">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h4"/><path d="M11 8h7"/><path d="M11 12h10"/></svg>
          По возрастанию
        </label>
      </div>
      
      <button id="default_settings_btn" class="btn-secondary" style="margin-top: 4px; padding: 6px; font-size: 11px; opacity: 0.8; width: 100%;">
        Сбросить настройки интерфейса
      </button>
    </div>

    <button id="collect_btn" class="btn-collect">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Собрать и скачать
    </button>

    <!-- Кнопки управления (видны только во время сбора) -->
    <div class="action-buttons" id="action-buttons">
      <button id="stop_btn" class="btn-stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Стоп
      </button>
      <button id="finish_btn" class="btn-finish">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Завершить
      </button>
    </div>

    <div class="action-buttons" id="done-buttons" style="display:none; flex-direction: column; gap: 0;">
      <button id="download_btn" class="btn-collect" style="background: var(--success); color: #0E0E10;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Скачать файл
      </button>
      <button id="reset_btn" class="btn-secondary">
        Сбросить и начать заново
      </button>
    </div>

    <!-- Кнопки при обогащении (соц. сети / панели) -->
    <div id="enrich-running-buttons" style="display:none; margin-top: 0;">
      <button id="stop_enrich_btn" class="btn-stop" style="width:100%;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Стоп
      </button>
    </div>

    <div id="enrich-paused-buttons" style="display:none; margin-top: 0; gap: 8px;">
      <button id="continue_enrich_btn" class="btn-collect" style="flex: 1; padding: 11px; font-size: 13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Продолжить
      </button>
      <button id="cancel_enrich_btn" class="btn-stop" style="flex: 1; padding: 11px; font-size: 13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Отменить
      </button>
    </div>


    <div style="text-align: center;">
      <span id="status-pill" class="status-pill" style="display:none;"></span>
    </div>

  </div>

  <!-- DEBUG VIEW -->
  <div class="container" id="debug-view" style="display: none;">
    <div class="section">
      <div class="section-title">Панель отладки</div>
      
      <label class="checkbox-label" style="margin-bottom: 12px; display: flex; align-items: center; width: 100%;">
        <input type="checkbox" id="cb_disable_logging"> Отключить ведение логов
      </label>
      
      <button id="download_logs_btn" class="btn-collect" style="background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px; font-size: 13px; border: none; border-radius: 9px; cursor: pointer; transition: all 0.2s;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Скачать дебаг-логи
      </button>
      
      <button id="clear_logs_btn" class="btn-secondary" style="margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        Очистить логи
      </button>

      <button id="full_reset_btn" class="btn-secondary" style="margin-top: 24px; width: 100%; color: var(--error); border-color: rgba(255,79,77,0.35); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Полный сброс расширения (Экстренный)
      </button>
    </div>
    
    <button id="debug_back_btn" class="btn-secondary" style="width: 100%; margin-top: 10px; padding: 10px; font-size: 13px;">
      Назад
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
