<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #9146FF;
      --primary-hover: #A970FF;
      --bg: #0E0E10;
      --surface: #18181B;
      --surface-light: #26262C;
      --text: #EFEFF1;
      --text-muted: #ADADB8;
      --border: #3A3A3D;
      --success: #00E6CB;
      --error: #FF4F4D;
      --warning: #F0B300;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 340px;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a1a20, var(--primary));
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(145, 70, 255, 0.3);
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      outline: none;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .header-btn.active {
      background: rgba(145, 70, 255, 0.2);
      color: var(--primary-hover);
      border-color: rgba(145, 70, 255, 0.4);
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .container {
      padding: 16px;
    }

    .section {
      background: var(--surface);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    .section:hover {
      border-color: rgba(145, 70, 255, 0.4);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      letter-spacing: 0.8px;
    }

    .grid-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      color: var(--text);
      transition: color 0.2s;
    }

    .checkbox-label:hover {
      color: var(--primary-hover);
    }

    .checkbox-label input {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      margin-right: 7px;
      background-color: var(--surface-light);
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .checkbox-label input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .checkbox-label input:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 10px;
      font-weight: bold;
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    select {
      cursor: pointer;
      appearance: none;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .two-col {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .two-col label {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    .two-col input {
      width: 90px;
      padding: 7px;
      text-align: center;
      flex-shrink: 0;
    }

    .radio-group {
      display: flex;
      gap: 18px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
    }

    .radio-label input {
      margin-right: 7px;
      accent-color: var(--primary);
      width: 15px;
      height: 15px;
    }

    /* ===== PROGRESS SECTION ===== */
    #progress-section {
      background: var(--surface);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: none;
    }

    #progress-section.visible {
      display: block;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .progress-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-hover);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-wrap {
      height: 8px;
      background: var(--surface-light);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9146FF, #C27AFF, #9146FF);
      background-size: 200% 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
      animation: shimmer 1.8s linear infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .progress-bar-fill.done {
      background: linear-gradient(90deg, var(--success), #00b09b);
      animation: none;
    }

    .progress-bar-fill.indeterminate {
      width: 100% !important;
      animation: shimmer 1.8s linear infinite, pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.7;
      }

      to {
        opacity: 1;
      }
    }

    .progress-sub {
      margin-top: 7px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ===== BUTTON ===== */
    .btn-collect {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-collect:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(145, 70, 255, 0.35);
    }

    .btn-collect:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-collect:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary-hover);
    }

    .action-buttons {
      display: none;
      gap: 8px;
      margin-top: 0;
    }

    .action-buttons.visible {
      display: flex;
    }

    .btn-stop {
      flex: 1;
      padding: 11px;
      background: rgba(255, 79, 77, 0.12);
      color: var(--error);
      border: 1px solid rgba(255, 79, 77, 0.35);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-stop:hover {
      background: rgba(255, 79, 77, 0.22);
      border-color: var(--error);
    }

    .btn-finish {
      flex: 1;
      padding: 11px;
      background: rgba(240, 179, 0, 0.12);
      color: var(--warning);
      border: 1px solid rgba(240, 179, 0, 0.35);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-finish:hover {
      background: rgba(240, 179, 0, 0.22);
      border-color: var(--warning);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    .status-pill.running {
      background: rgba(145, 70, 255, 0.15);
      color: var(--primary-hover);
    }

    .status-pill.done {
      background: rgba(0, 230, 203, 0.15);
      color: var(--success);
    }

    .status-pill.error {
      background: rgba(255, 79, 77, 0.15);
      color: var(--error);
    }

    .dot-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: dotPulse 1s ease-in-out infinite;
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* ===== КАСТОМНЫЙ СПИСОК ЯЗЫКОВ ===== */
    .lang-select-container {
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 7px;
      margin-bottom: 10px;
    }

    .lang-list {
      max-height: 120px;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lang-list .checkbox-label {
      padding: 5px 6px;
      margin: 0;
    }

    .lang-list .checkbox-label:hover {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 5px;
    }

    /* ===== ИДЕАЛЬНОЕ ЦЕНТРИРОВАНИЕ INPUT NUMBER ===== */
    input[type="number"]::-webkit-inner-spin-button,

    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ===== LANGUAGE MENU ===== */
    .lang-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 100;
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 6px;
      min-width: 140px;
    }
    .lang-dropdown.show {
      display: flex;
    }
    .lang-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      border-radius: 5px;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--primary-hover);
    }
    .lang-option.active {
      background: rgba(145, 70, 255, 0.15);
      color: var(--primary-hover);
      font-weight: 600;
    }

    /* ===== STATS BLOCK (C4) ===== */
    .stats-block {
      background: var(--surface-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .stats-row:last-child {
      margin-bottom: 0;
    }
    .stats-label {
      color: var(--text-muted);
    }
    .stats-value {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .stats-top {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .stats-top-title {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-top-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 2px;
    }

    /* ===== DONE BUTTONS COLUMN LAYOUT ===== */
    .done-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .btn-copy {
      flex: 1;
      padding: 11px;
      background: transparent;
      color: var(--primary-hover);
      border: 1px solid rgba(145, 70, 255, 0.4);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-copy:hover {
      background: rgba(145, 70, 255, 0.12);
      border-color: var(--primary);
    }

    /* ===== INTERRUPTED RECOVERY (A3) ===== */
    .recovery-block {
      background: rgba(240, 179, 0, 0.08);
      border: 1px solid rgba(240, 179, 0, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text);
      line-height: 1.4;
    }
  </style>

</head>

<body>
    <div class="header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="position: relative;">
        <button id="ui_lang_btn" class="header-btn" title="Language">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-languages-icon lucide-languages"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        </button>
        <div id="ui_lang_menu" class="lang-dropdown">
          <div class="lang-option" data-lang="ru">🇷🇺 Русский</div>
          <div class="lang-option" data-lang="en">🇬🇧 English</div>
        </div>
      </div>
      <h2 data-i18n="app_title">Twitch Scraper</h2>
    </div>
    <button id="debug_toggle_btn" class="header-btn" data-i18n-title="btn_debug_title" title="Панель отладки">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-bug-icon lucide-bug">
        <path d="M12 20v-9" />
        <path d="M14 7a4 4 0 0 1 4 4v3a6 6 0 0 1-12 0v-3a4 4 0 0 1 4-4z" />
        <path d="M14.12 3.88 16 2" />
        <path d="M21 21a4 4 0 0 0-3.81-4" />
        <path d="M21 5a4 4 0 0 1-3.55 3.97" />
        <path d="M22 13h-4" />
        <path d="M3 21a4 4 0 0 1 3.81-4" />
        <path d="M3 5a4 4 0 0 0 3.55 3.97" />
        <path d="M6 13H2" />
        <path d="m8 2 1.88 1.88" />
        <path d="M9 7.13V6a3 3 0 1 1 6 0v1.13" />
      </svg>
    </button>
  </div>

  <!-- MAIN VIEW -->
  <div class="container" id="main-view">

    <!-- PROGRESS (hidden if inactive) -->
    <div id="progress-section">
      <div class="progress-header">
        <span class="progress-label" id="progress-label" data-i18n="progress_gathering">Collecting data...</span>
        <span class="progress-count" id="progress-count">0</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill indeterminate" id="progress-bar"></div>
      </div>
      <div class="progress-sub" id="progress-sub" data-i18n="progress_init">Initializing...</div>
    </div>

    <!-- FIELDS TO COLLECT -->
    <div class="section" id="fields-section">
      <div class="section-title" data-i18n="sec_fields">Data to collect</div>
      <div class="grid-options">
        <label class="checkbox-label"><input type="checkbox" id="cb_channel" checked> <span data-i18n="cb_channel">Channel</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_category" checked> <span data-i18n="cb_category">Category</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_tags" checked> <span data-i18n="cb_tags">Tags</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_viewers" checked> <span data-i18n="cb_viewers">Viewers</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_followers" checked> <span data-i18n="cb_followers">Followers</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_title" checked> <span data-i18n="cb_title">Title</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_language" checked> <span data-i18n="cb_language">Language</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_url" checked> <span data-i18n="cb_url">URL</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_desc" checked> <span data-i18n="cb_desc">Description</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_social" checked> <span data-i18n="cb_social">Social Networks</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_panels"> <span data-i18n="cb_panels">Panels</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_starttime"> <span data-i18n="cb_starttime">Start Time</span></label>
        <label class="checkbox-label"><input type="checkbox" id="cb_duration"> <span data-i18n="cb_duration">Duration</span></label>
      </div>
    </div>

    <!-- FILTER -->
    <div class="section" id="filter-section">
      <div class="section-title" data-i18n="sec_filters">Filters</div>
      <div class="lang-select-container">
        <div class="lang-list" id="lang_list"></div>
      </div>
      <div class="two-col" style="margin-top: 10px;">
        <label for="min_viewers" data-i18n="filter_min_viewers">Min viewers:</label>
        <input type="number" id="min_viewers" value="0" min="0" max="10000000">
      </div>
      <label class="checkbox-label" style="margin-top: 8px;">
        <input type="checkbox" id="cb_subonly"> <span data-i18n="cb_subonly">Include Private (Sub-Only)</span>
      </label>
    </div>

    <!-- FORMATTING -->
    <div class="section" id="format-section">
      <div class="section-title" data-i18n="sec_format">Time and Duration Format</div>
      <div style="margin-bottom: 10px;">
        <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;" data-i18n="lbl_starttime">Start Time</label>
        <select id="format_starttime">
          <option value="iso" selected data-i18n="opt_iso">ISO 8601</option>
          <option value="unix" data-i18n="opt_unix">Unixtime</option>
          <option value="gmt" data-i18n="opt_gmt">GMT 0</option>
          <option value="local12" data-i18n="opt_local12">Local (12 hours)</option>
          <option value="local24" data-i18n="opt_local24">Local (24 hours)</option>
        </select>
      </div>
      <div>
        <label style="display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px;" data-i18n="lbl_duration">Duration</label>
        <select id="format_duration">
          <option value="hms" selected data-i18n="opt_hms">Hours:Minutes:Seconds (02:15:30)</option>
          <option value="sec" data-i18n="opt_sec">Total seconds (8130s)</option>
        </select>
      </div>
    </div>

    <div class="section" id="sort-section">
      <div class="section-title" data-i18n="sec_sort">Sort by viewers</div>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="sort_dir" value="desc" checked>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;">
            <path d="m3 16 4 4 4-4" />
            <path d="M7 20V4" />
            <path d="M11 4h10" />
            <path d="M11 8h7" />
            <path d="M11 12h4" />
          </svg>
          <span data-i18n="sort_desc">Descending</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="sort_dir" value="asc">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;">
            <path d="m3 16 4 4 4-4" />
            <path d="M7 20V4" />
            <path d="M11 4h4" />
            <path d="M11 8h7" />
            <path d="M11 12h10" />
          </svg>
          <span data-i18n="sort_asc">Ascending</span>
        </label>
      </div>
    </div>

    <div class="section" id="settings-section">
      <div class="section-title" data-i18n="sec_export">Export Settings</div>
      <div class="two-col" style="margin-bottom: 12px;">
        <label for="max_streams" data-i18n="export_limit">Limit (0 - unlimited):</label>
        <input type="number" id="max_streams" value="0" min="0" max="100000">
      </div>
      <div class="radio-group" style="margin-bottom: 12px;">
        <label class="radio-label"><input type="radio" name="format" value="json" checked> <span data-i18n="export_json">JSON</span></label>
        <label class="radio-label"><input type="radio" name="format" value="md"> <span data-i18n="export_md">Markdown</span></label>
        <label class="radio-label"><input type="radio" name="format" value="csv"> <span data-i18n="export_csv">CSV</span></label>
      </div>

      <button id="default_settings_btn" class="btn-secondary"
        style="margin-top: 4px; padding: 6px; font-size: 11px; opacity: 0.8; width: 100%;">
        <span data-i18n="btn_reset_ui">Reset UI Settings</span>
      </button>
    </div>

    <button id="collect_btn" class="btn-collect">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      <span data-i18n="btn_collect">Собрать и скачать</span>
    </button>

    <!-- Interrupted-run recovery block (A3) -->
    <div id="recovery-block" class="recovery-block" style="display:none;"></div>

    <!-- Statistics block (C4) — shown after collection completes -->
    <div id="stats-block" class="stats-block" style="display:none;"></div>

    <!-- Control buttons (visible only during collection) -->
    <div class="action-buttons" id="action-buttons">
      <button id="stop_btn" class="btn-stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2" />
        </svg>
        <span data-i18n="btn_stop">Стоп</span>
      </button>
      <button id="finish_btn" class="btn-finish">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span data-i18n="btn_finish">Завершить</span>
      </button>
    </div>

    <div class="action-buttons" id="done-buttons" style="display:none; flex-direction: column; gap: 0;">
      <button id="download_btn" class="btn-collect" style="background: var(--success); color: #0E0E10;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span data-i18n="btn_download_file">Download File</span>
      </button>
      <div class="done-row" style="margin-top: 8px;">
        <button id="copy_btn" class="btn-copy">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span data-i18n="btn_copy">Copy JSON</span>
        </button>
        <button id="reset_btn" class="btn-secondary" style="margin-top: 0; flex: 1;">
          <span data-i18n="btn_reset_full">Reset and Start Over</span>
        </button>
      </div>
    </div>

    <!-- Enrichment buttons (socials / panels) -->
    <div id="enrich-running-buttons" style="display:none; margin-top: 0;">
      <button id="stop_enrich_btn" class="btn-stop" style="width:100%;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="4" width="16" height="16" rx="2" />
        </svg>
        <span data-i18n="btn_stop">Стоп</span>
      </button>
    </div>

    <div id="enrich-paused-buttons" style="display:none; margin-top: 0; gap: 8px;">
      <button id="continue_enrich_btn" class="btn-collect" style="flex: 1; padding: 11px; font-size: 13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
        <span data-i18n="btn_continue">Продолжить</span>
      </button>
      <button id="cancel_enrich_btn" class="btn-stop" style="flex: 1; padding: 11px; font-size: 13px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
        <span data-i18n="btn_cancel">Отменить</span>
      </button>
    </div>


    <div style="text-align: center;">
      <span id="status-pill" class="status-pill" style="display:none;"></span>
    </div>

  </div>

  <!-- DEBUG VIEW -->
  <div class="container" id="debug-view" style="display: none;">
    <div class="section">
      <div class="section-title" data-i18n="sec_debug">Панель отладки</div>

      <label class="checkbox-label" style="margin-bottom: 12px; display: flex; align-items: center; width: 100%;">
        <input type="checkbox" id="cb_disable_logging"> <span data-i18n="cb_disable_log">Отключить ведение логов</span>
      </label>

      <button id="download_logs_btn" class="btn-collect"
        style="background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px; font-size: 13px; border: none; border-radius: 9px; cursor: pointer; transition: all 0.2s;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        <span data-i18n="btn_dl_logs">Скачать дебаг-логи</span>
      </button>

      <button id="clear_logs_btn" class="btn-secondary"
        style="margin-top: 8px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
        </svg>
        <span data-i18n="btn_clear_logs">Очистить логи</span>
      </button>

      <button id="full_reset_btn" class="btn-secondary"
        style="margin-top: 24px; width: 100%; color: var(--error); border-color: rgba(255,79,77,0.35); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-size: 12px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span data-i18n="btn_emergency_reset">Full reset (Emergency)</span>
      </button>
    </div>

    <button id="debug_back_btn" class="btn-secondary"
      style="width: 100%; margin-top: 10px; padding: 10px; font-size: 13px;">
      <span data-i18n="btn_back">Назад</span>
    </button>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
